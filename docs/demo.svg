<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-label="微信公众号一句话下单麦当劳的对话演示">
  <title>mcd-txt-order 对话演示</title>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

    <!-- 会话外框 -->
    <rect x="20" y="20" width="720" height="540" rx="26" fill="#EDEDED" stroke="#D6D6D6" stroke-width="1"/>
    <line x1="20" y1="76" x2="740" y2="76" stroke="#D8D8D8" stroke-width="1"/>
    <text x="380" y="55" font-size="16" fill="#191919" text-anchor="middle">麦当劳点单助手</text>
    <text x="714" y="55" font-size="18" fill="#7A7A7A" text-anchor="end" letter-spacing="1">···</text>

    <!-- ① 用户：一句话 -->
    <circle cx="693" cy="107" r="17" fill="#C8C8C8"/>
    <rect x="456" y="88" width="210" height="38" rx="8" fill="#95EC69"/>
    <path d="M666 98 L674 94 L674 110 Z" fill="#95EC69"/>
    <text x="470" y="112" font-size="15" fill="#191919">巨无霸不要酸黄瓜 香梅北</text>

    <!-- ② 助手：预览卡片 -->
    <circle cx="57" cy="152" r="17" fill="#C8C8C8"/>
    <rect x="84" y="134" width="440" height="276" rx="10" fill="#FFFFFF"/>
    <path d="M84 148 L74 144 L74 158 Z" fill="#FFFFFF"/>

    <text x="100" y="162" font-size="15" font-weight="600" fill="#191919">📍 麦当劳深圳香梅北餐厅</text>
    <text x="100" y="181" font-size="12" fill="#8C8C8C">距离约 374m　·　到店自提</text>
    <line x1="100" y1="195" x2="508" y2="195" stroke="#E6E6E6" stroke-width="1"/>

    <text x="100" y="218" font-size="14" fill="#191919">巨无霸 ×1</text>
    <text x="508" y="218" font-size="14" fill="#191919" text-anchor="end">¥26.50</text>
    <text x="100" y="237" font-size="12" fill="#8C8C8C">特制：不要酸黄瓜</text>
    <line x1="100" y1="253" x2="508" y2="253" stroke="#E6E6E6" stroke-width="1"/>

    <text x="100" y="275" font-size="13" fill="#8C8C8C">商品合计</text>
    <text x="508" y="275" font-size="13" fill="#191919" text-anchor="end">¥26.50</text>
    <text x="100" y="295" font-size="13" fill="#8C8C8C">优惠</text>
    <text x="508" y="295" font-size="13" fill="#FA5151" text-anchor="end">-¥2.65</text>

    <text x="100" y="323" font-size="14" font-weight="600" fill="#191919">应付</text>
    <text x="508" y="324" font-size="18" font-weight="700" fill="#FA5151" text-anchor="end">¥23.85</text>
    <line x1="100" y1="338" x2="508" y2="338" stroke="#E6E6E6" stroke-width="1"/>

    <text x="100" y="358" font-size="12" fill="#8C8C8C">取餐方式　堂食</text>
    <text x="100" y="376" font-size="12" fill="#8C8C8C">已自动抵扣 ¥2.65</text>
    <line x1="100" y1="390" x2="508" y2="390" stroke="#E6E6E6" stroke-width="1"/>
    <text x="100" y="400" font-size="13" fill="#191919">回复「确认」下单，回复「取消」放弃。</text>

    <!-- ③ 用户：确认 -->
    <circle cx="693" cy="437" r="17" fill="#C8C8C8"/>
    <rect x="602" y="418" width="64" height="38" rx="8" fill="#95EC69"/>
    <path d="M666 428 L674 424 L674 440 Z" fill="#95EC69"/>
    <text x="616" y="442" font-size="15" fill="#191919">确认</text>

    <!-- ④ 助手：下单结果 -->
    <circle cx="57" cy="482" r="17" fill="#C8C8C8"/>
    <rect x="84" y="464" width="350" height="78" rx="10" fill="#FFFFFF"/>
    <path d="M84 478 L74 474 L74 488 Z" fill="#FFFFFF"/>
    <text x="100" y="493" font-size="14" fill="#191919">✅ 订单已创建 TB20261010XXXXX</text>
    <text x="100" y="516" font-size="14" fill="#FA5151">👉 点此支付（30 分钟内有效）</text>

    <!-- 说明 -->
    <text x="380" y="583" font-size="12" fill="#9A9A9A" text-anchor="middle">离线演示模式输出，未产生真实订单</text>
  </g>
</svg>
