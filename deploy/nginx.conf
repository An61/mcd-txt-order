# Nginx 反代示例（不用 Caddy 时用这个）。
# 放到 /etc/nginx/conf.d/mcd-txt-order.conf，证书路径按你的实际情况改。

# 上游：Node 进程。keepalive 复用连接，省掉每次回调重新握手
upstream mcd_txt_order {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    server_name mcd.example.com;
    # 微信回调必须是 https，http 只做跳转；但注意：
    # 微信服务器配置校验不支持 301/302 跟随，所以**填后台时务必写 https:// 的完整地址**
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcd.example.com;

    ssl_certificate     /etc/letsencrypt/live/mcd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcd.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 只放行回调与健康检查
    location = /wechat {
        proxy_pass http://mcd_txt_order;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：必须小于微信的 5 秒。超时后 Nginx 返回 504，
        # 微信会判定本次失败并重试；我们的服务已在 4.3 秒处自行回 success，
        # 这两个值配合起来才是「不重试 + 异步补发」的完整链路
        proxy_read_timeout 5s;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://mcd_txt_order;
        access_log off;
    }

    location / {
        return 404;
    }

    client_max_body_size 1m;
}
